
name: Build All Foundation Android App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www
          cp index.html www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.allfoundation.group",
            "appName": "All Foundation Group",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: All-Foundation-Group-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
